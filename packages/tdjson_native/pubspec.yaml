name: tdjson_native
description: "Bundles the TDLib JSON interface (libtdjson) for iOS and Linux and exposes a thin dart:ffi binding."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.13.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
